[project]
name = "template-variable-placeholder-substitutor"
version = "0.1.0"
description = "Substitutes ${name} and {{name}} placeholders from a dict, reporting all missing keys."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
